name: nool-school-admin

services:
  web:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* vars are inlined at build time - see the Dockerfile
        # comment. `docker compose` only auto-loads a file literally named
        # `.env`, not `.env.local` - run `docker compose --env-file
        # .env.local build` (and `up`) to source these from the same file
        # `next dev` already uses, or copy .env.local to .env if you'd
        # rather not pass the flag every time.
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        # http://localhost:8080 (nool-core's NGINX gateway) works even
        # though this app runs in its own container - NEXT_PUBLIC_* calls
        # happen from the browser on the host, not from inside this
        # container, so no shared Docker network with nool-core is needed.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "${PORT_HOST:-3100}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
